# Кладётся в форк Pisex/cs2-admin_system_modules как .github/workflows/build.yml
# (заменяет оригинальный — тот собирает все модули на снятом с runner'ов ubuntu-20.04).
# Собирает только CheckCheats на ubuntu-22.04, артефакт: as_checkcheats.so
name: Build CheckCheats (PcCheckMenu)

on:
  workflow_dispatch:
  push:
    paths-ignore: [ 'README.md' ]
    branches: [ main, pccheckmenu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      MANIFEST_PATH: "${{ github.workspace }}/external/metamod-source/hl2sdk-manifests"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        env:
          # Пины на середину октября 2025 (alliedmodders hl2sdk):
          #  - as_checkcheats.cpp последний раз менялся 2025-08-01 (OnCheckTransmit +
          #    CCheckTransmitInfoHack), поэтому SchemaEntity нужен HEAD окт-2025:
          #    только он даёт CCheckTransmitInfoHack и сам определяет
          #    FL_CONTROLLER_FAKECLIENT / FL_PAWN_FAKECLIENT;
          #  - hl2sdk cs2 окт-2025: новый API NetworkStateChangedData(uint32,int32,
          #    ChangeAccessorFieldPathIndex_t), но ещё есть tier1/generichash.cpp и
          #    lib/linux64/tier1.a (удалены лишь 2026-07-17), жёстко нужные
          #    CheckCheats/AMBuildScript + manifests/cs2.json;
          #  - SchemaEntity HEAD писан под форк "Wender SDK" (тип NetworkStateChanged_t);
          #    у alliedmodders этот же тип называется NetworkStateChangedData с той же
          #    сигнатурой конструктора — приводим sed'ом (см. ниже).
          HL2SDK_CS2_REF: 84a823db042b49d2f6934b770dafbf3a366cef26   # 2025-10-15
          MMSOURCE_REF: 4399ff0fd4ad7a6620f6763afe6fc0e30005496a     # 2025-10-15
          SCHEMAENTITY_REF: e7965b3c83ec684d44584ee6457c5482ee5d9db1 # 2025-10-17
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qy
          sudo apt-get install -y git clang lld binutils python3 python3-pip zip
          python3 -m pip install --upgrade pip setuptools wheel
          git clone https://github.com/alliedmodders/ambuild.git
          python3 -m pip install ./ambuild
          mkdir external
          cd external

          git clone --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
          git -C metamod-source fetch --depth 1 origin "$MMSOURCE_REF"
          git -C metamod-source checkout "$MMSOURCE_REF"
          git -C metamod-source submodule update --init --recursive

          git clone --branch cs2 --single-branch https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 fetch --depth 1 origin "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 checkout "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 submodule update --init --recursive || true
          test -f hl2sdk-cs2/tier1/generichash.cpp

          cd ../..
          mkdir -p samples
          cd samples
          git clone https://github.com/pisex/SchemaEntity.git
          git -C SchemaEntity fetch --depth 1 origin "$SCHEMAENTITY_REF"
          git -C SchemaEntity checkout "$SCHEMAENTITY_REF"
          # Wender SDK -> alliedmodders hl2sdk: одинаковый тип под разными именами.
          sed -i 's/\bNetworkStateChanged_t\b/NetworkStateChangedData/g' SchemaEntity/schemasystem.cpp
          grep -n "NetworkStateChangedData" SchemaEntity/schemasystem.cpp || true
          cd "${{ github.workspace }}"

      - name: Build CheckCheats
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cd CheckCheats
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests=./hl2sdk-manifests \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"
          ambuild

      - name: Show build outputs
        run: |
          find CheckCheats/build -name '*.so' -print -exec ls -la {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckCheats-so
          if-no-files-found: error
          path: |
            CheckCheats/build/**/*.so
            CheckCheats/build/package/**
