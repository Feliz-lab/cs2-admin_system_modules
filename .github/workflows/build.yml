# Кладётся в форк Pisex/cs2-admin_system_modules как .github/workflows/build.yml
# Собирает CheckCheats ВНУТРИ контейнера ubuntu:20.04 (glibc 2.31), а не на самом
# раннере (тот теперь ubuntu-22.04+/glibc 2.35+). Раннер сам по себе только водит
# Docker — ubuntu-20.04 как ОС раннера GitHub уже не даёт, а как container: job
# образ работает как раньше и содержит нужный (старый) glibc.
#
# Почему это важно: бинарник, слинкованный на glibc >= 2.32, откажется грузиться
# на игровом сервере со старым glibc ("GLIBC_2.32 not found") — именно это и
# сломало живой as_checkcheats.so на сервере. Ориганильный CI Pisex использовал
# ubuntu-20.04 (glibc 2.31) не просто так — это и есть цель совместимости.
name: Build CheckCheats (PcCheckMenu)

on:
  workflow_dispatch:
  push:
    paths-ignore: [ 'README.md' ]
    branches: [ main, pccheckmenu ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Bootstrap git (actions/checkout needs it inside the bare container)
        run: |
          set -eux
          # Ubuntu 20.04 достиг EOL стандартной поддержки — обычные зеркала архива
          # могут 404'иться, переключаемся на old-releases на всякий случай.
          sed -i \
            -e 's|archive.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g' \
            -e 's|security.ubuntu.com/ubuntu|old-releases.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list || true
          apt-get update -qy || (sed -i \
            -e 's|old-releases.ubuntu.com/ubuntu|archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list && apt-get update -qy)
          apt-get install -y git ca-certificates

      # ВАЖНО: внутри container: job нельзя использовать expression-контекст
      # ${{ github.workspace }} для путей — раннер вычисляет его ДО входа в
      # контейнер, и получается путь хоста (/home/runner/work/...), которого
      # внутри контейнера не существует (там смонтировано как /__w/...).
      # Правильный путь — переменная окружения $GITHUB_WORKSPACE, её сам
      # Actions runner подставляет уже актуальной ВНУТРИ контейнера.
      - name: Resolve workspace-relative paths
        run: |
          set -eux
          echo "HL2SDK_ROOT=$GITHUB_WORKSPACE/external" >> "$GITHUB_ENV"
          echo "MMS_PATH=$GITHUB_WORKSPACE/external/metamod-source" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=$GITHUB_WORKSPACE/external/metamod-source/hl2sdk-manifests" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        env:
          # Те же пины что и раньше (за версии hl2sdk/metamod/SchemaEntity этот шаг
          # не отвечает — это отдельная история совместимости API, см. коммиты).
          HL2SDK_CS2_REF: 84a823db042b49d2f6934b770dafbf3a366cef26   # 2025-10-15
          MMSOURCE_REF: 4399ff0fd4ad7a6620f6763afe6fc0e30005496a     # 2025-10-15
          SCHEMAENTITY_REF: e7965b3c83ec684d44584ee6457c5482ee5d9db1 # 2025-10-17
        run: |
          set -eux
          apt-get install -y clang lld binutils python3 python3-pip zip
          python3 -m pip install --upgrade pip setuptools wheel
          git clone https://github.com/alliedmodders/ambuild.git
          python3 -m pip install ./ambuild
          mkdir external
          cd external

          git clone --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
          git -C metamod-source fetch --depth 1 origin "$MMSOURCE_REF"
          git -C metamod-source checkout "$MMSOURCE_REF"
          git -C metamod-source submodule update --init --recursive

          git clone --branch cs2 --single-branch https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 fetch --depth 1 origin "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 checkout "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 submodule update --init --recursive || true
          test -f hl2sdk-cs2/tier1/generichash.cpp

          cd ../..
          mkdir -p samples
          cd samples
          git clone https://github.com/pisex/SchemaEntity.git
          git -C SchemaEntity fetch --depth 1 origin "$SCHEMAENTITY_REF"
          git -C SchemaEntity checkout "$SCHEMAENTITY_REF"
          # Wender SDK -> alliedmodders hl2sdk: те же сущности под другими именами.
          grep -rlZ -e 'NetworkStateChanged_t' -e 'FL_CONTROLLER_FAKECLIENT' -e 'FL_PAWN_FAKECLIENT' SchemaEntity \
            | xargs -0 -r sed -i \
              -e 's/\bNetworkStateChanged_t\b/NetworkStateChangedData/g' \
              -e 's/\bFL_CONTROLLER_FAKECLIENT\b/FL_FAKECLIENT/g' \
              -e 's/\bFL_PAWN_FAKECLIENT\b/FL_FAKECLIENT/g'
          ! grep -rn -e 'NetworkStateChanged_t' -e 'FL_CONTROLLER_FAKECLIENT' -e 'FL_PAWN_FAKECLIENT' SchemaEntity
          cd "$GITHUB_WORKSPACE"

      - name: Build CheckCheats
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cd CheckCheats
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests=./hl2sdk-manifests \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"
          ambuild

      - name: Show build outputs + glibc requirement
        run: |
          set -eux
          find CheckCheats/build -name '*.so' -print -exec ls -la {} \;
          SO=$(find CheckCheats/build/package -name 'as_checkcheats.so')
          echo "Max GLIBC symbol version required by $SO:"
          objdump -T "$SO" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckCheats-so
          if-no-files-found: error
          path: |
            CheckCheats/build/**/*.so
            CheckCheats/build/package/**
