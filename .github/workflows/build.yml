# Кладётся в форк Pisex/cs2-admin_system_modules как .github/workflows/build.yml
# (заменяет оригинальный — тот собирает все модули на снятом с runner'ов ubuntu-20.04).
# Собирает только CheckCheats на ubuntu-22.04, артефакт: as_checkcheats.so
name: Build CheckCheats (PcCheckMenu)

on:
  workflow_dispatch:
  push:
    paths-ignore: [ 'README.md' ]
    branches: [ main, pccheckmenu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      MANIFEST_PATH: "${{ github.workspace }}/external/metamod-source/hl2sdk-manifests"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        env:
          # Репозиторий заморожен ~на релизе v16 (март 2025). Пинним весь набор
          # зависимостей на январь–февраль 2025, иначе:
          #  - hl2sdk cs2 позже удалил tier1/generichash.cpp и tier1.a (жёстко нужны
          #    CheckCheats/AMBuildScript + manifests/cs2.json);
          #  - свежий pisex/SchemaEntity требует новый API hl2sdk (NetworkStateChanged_t).
          HL2SDK_CS2_REF: 680daff5f16754a605455b6476699901cb0483c6   # 2025-01-23
          MMSOURCE_REF: ccce734e121a6086cb45773d6d3d754e81a81dbb     # 2025-01-17
          SCHEMAENTITY_REF: 5418de7d3c5e3bed00aac3cc175fa74066792bab # 2025-02-11
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qy
          sudo apt-get install -y git clang lld binutils python3 python3-pip zip
          python3 -m pip install --upgrade pip setuptools wheel
          git clone https://github.com/alliedmodders/ambuild.git
          python3 -m pip install ./ambuild
          mkdir external
          cd external

          git clone --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
          git -C metamod-source fetch --depth 1 origin "$MMSOURCE_REF"
          git -C metamod-source checkout "$MMSOURCE_REF"
          git -C metamod-source submodule update --init --recursive

          git clone --branch cs2 --single-branch https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 fetch --depth 1 origin "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 checkout "$HL2SDK_CS2_REF"
          git -C hl2sdk-cs2 submodule update --init --recursive || true
          test -f hl2sdk-cs2/tier1/generichash.cpp

          cd ../..
          mkdir -p samples
          cd samples
          git clone https://github.com/pisex/SchemaEntity.git
          git -C SchemaEntity fetch --depth 1 origin "$SCHEMAENTITY_REF"
          git -C SchemaEntity checkout "$SCHEMAENTITY_REF"
          cd "${{ github.workspace }}"

      - name: Build CheckCheats
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cd CheckCheats
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests=./hl2sdk-manifests \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"
          ambuild

      - name: Show build outputs
        run: |
          find CheckCheats/build -name '*.so' -print -exec ls -la {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckCheats-so
          if-no-files-found: error
          path: |
            CheckCheats/build/**/*.so
            CheckCheats/build/package/**
