# Кладётся в форк Pisex/cs2-admin_system_modules как .github/workflows/build.yml
#
# История промахов (по возрастанию точности среды):
#  1) ubuntu-22.04 напрямую -> .so требовал GLIBC_2.32, которого нет на игровом
#     сервере ("GLIBC_2.32' not found").
#  2) container: ubuntu:20.04 -> глибц ок, но собранный .so падал в рантайме на
#     "undefined symbol: g_bUpdateStringTokenDatabase" — эта переменная реально
#     живёт в прекомпилированных lib/linux64/{tier1,interfaces}.a из hl2sdk,
#     а Ubuntu 20.04 (не тот тулчейн/ABI, каким Valve собирает свой SDK) их
#     резолвит не так, как надо.
#  3) (эта версия) Собираем внутри официального Steam Runtime "sniper" —
#     именно в нём Valve собирает сам CS2 и hl2sdk-cs2, это гарантированно
#     совпадающий ABI. Ровно так же уже собираются другие плагины этого же
#     проекта под тот же боевой сервер (VoteSystem-metamod, cs2-anticheat и
#     т.д. - Feliz-lab). Заодно берём metamod-source на коммит ПЕРЕД тем, где
#     убрали SourceHook и подняли PLAPI до 18 (боевой сервер — Metamod
#     2.0.0-dev+1459, PLAPI 17; более новый плагин он отвергнет).
name: Build CheckCheats (PcCheckMenu)

on:
  workflow_dispatch:
  push:
    paths-ignore: [ 'README.md' ]
    branches: [ main, pccheckmenu ]

env:
  SNIPER_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
  # metamod-source: a12f3cd5d7~1 - коммит перед удалением SourceHook (PLAPI 17,
  # совпадает с боевым Metamod 1459). Тот же пин что у VoteSystem-metamod.
  MMSOURCE_REF: 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339
  # hl2sdk cs2: последний коммит ПЕРЕД тем как 2026-07-17 убрали
  # tier1/generichash.cpp и lib/linux64/tier1.a (их жёстко требуют
  # CheckCheats/AMBuildScript и manifests/cs2.json) - максимально свежий ABI
  # в рамках этого ограничения.
  HL2SDK_CS2_REF: daf6a2275c34dc99f2fc421e6decb37c25b08587
  # pisex/SchemaEntity: HEAD - единственный коммит, который одновременно даёт
  # CCheckTransmitInfoHack (нужен OnCheckTransmit в as_checkcheats.cpp) и сам
  # определяет FL_CONTROLLER_FAKECLIENT/FL_PAWN_FAKECLIENT. Писан под форк
  # "Wender SDK" - имена под alliedmodders приводим sed'ом ниже.
  SCHEMAENTITY_REF: e7965b3c83ec684d44584ee6457c5482ee5d9db1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Загрузка образа Steam Runtime
        run: docker pull "$SNIPER_IMAGE"

      - name: Сборка в контейнере sniper
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            --entrypoint bash \
            "$SNIPER_IMAGE" -c '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              # В sniper apt-метаданные иногда просрочены - как в VoteSystem-metamod,
              # игнорируем Valid-Until и не валим шаг если что-то уже есть в образе.
              apt-get update -qq -o Acquire::Check-Valid-Until=false || true
              apt-get install -y --no-install-recommends \
                git ca-certificates curl python3 python3-pip python3-venv zip clang lld \
                >/dev/null 2>&1 || true

              command -v git    >/dev/null || { echo "::error::git недоступен в sniper"; exit 1; }
              command -v python3 >/dev/null || { echo "::error::python3 недоступен в sniper"; exit 1; }
              command -v g++    >/dev/null || command -v clang++ >/dev/null || { echo "::error::нет C++ компилятора"; exit 1; }

              # python3-pip в apt sniper часто нет/битый - ensurepip, а если и его
              # нет (urllib3/ssl-сборка без pip) - тащим get-pip.py вручную.
              python3 -m pip --version >/dev/null 2>&1 \
                || python3 -m ensurepip --upgrade >/dev/null 2>&1 \
                || { curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py \
                     && python3 /tmp/get-pip.py --quiet; }
              python3 -m pip --version

              git config --global --add safe.directory "*"

              # --- SDK ---
              mkdir -p /src/external
              cd /src/external
              git clone --quiet --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
              git -C metamod-source fetch --quiet --depth 1 origin "'"$MMSOURCE_REF"'"
              git -C metamod-source checkout --quiet "'"$MMSOURCE_REF"'"
              git -C metamod-source submodule update --init --recursive --quiet

              git clone --quiet --branch cs2 --single-branch https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
              git -C hl2sdk-cs2 fetch --quiet --depth 1 origin "'"$HL2SDK_CS2_REF"'"
              git -C hl2sdk-cs2 checkout --quiet "'"$HL2SDK_CS2_REF"'"
              git -C hl2sdk-cs2 submodule update --init --recursive --quiet || true
              test -f hl2sdk-cs2/tier1/generichash.cpp

              # samples/ должен лежать РЯДОМ с CheckCheats на уровень выше репозитория
              # (AMBuilder берёт "../../samples/SchemaEntity" от CheckCheats/) - кладём
              # его вне /src, в корень контейнера, арифметика путей совпадает 1:1.
              mkdir -p /samples
              cd /samples
              git clone --quiet https://github.com/pisex/SchemaEntity.git
              git -C SchemaEntity fetch --quiet --depth 1 origin "'"$SCHEMAENTITY_REF"'"
              git -C SchemaEntity checkout --quiet "'"$SCHEMAENTITY_REF"'"
              # Wender SDK -> alliedmodders hl2sdk: те же сущности под другими именами.
              grep -rlZ -e "NetworkStateChanged_t" -e "FL_CONTROLLER_FAKECLIENT" -e "FL_PAWN_FAKECLIENT" SchemaEntity \
                | xargs -0 -r sed -i \
                  -e "s/\bNetworkStateChanged_t\b/NetworkStateChangedData/g" \
                  -e "s/\bFL_CONTROLLER_FAKECLIENT\b/FL_FAKECLIENT/g" \
                  -e "s/\bFL_PAWN_FAKECLIENT\b/FL_FAKECLIENT/g"
              ! grep -rn -e "NetworkStateChanged_t" -e "FL_CONTROLLER_FAKECLIENT" -e "FL_PAWN_FAKECLIENT" SchemaEntity

              python3 -m pip install --quiet --upgrade pip setuptools wheel
              git clone --quiet https://github.com/alliedmodders/ambuild.git /tmp/ambuild
              python3 -m pip install --quiet /tmp/ambuild

              # --- Build ---
              cd /src/CheckCheats
              mkdir -p build && cd build
              CC=clang CXX=clang++ python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
                --hl2sdk-manifests=./hl2sdk-manifests \
                --mms_path=/src/external/metamod-source \
                --hl2sdk-root=/src/external
              ambuild

              chown -R "$(stat -c %u /src)":"$(stat -c %g /src)" /src/CheckCheats/build
            '

      - name: Сводка по бинарнику
        run: |
          set -euxo pipefail
          SO=$(find CheckCheats/build/package -name 'as_checkcheats.so')
          ls -la "$SO"
          file "$SO"
          echo "GLIBC:"; objdump -T "$SO" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -5
          echo "Undefined symbols (справочно, часть из них резолвится игрой в рантайме):"
          objdump -T "$SO" | awk '$2=="*UND*" && $NF!~"@" {print $NF}' | sort -u | head -40

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: CheckCheats-so
          if-no-files-found: error
          path: |
            CheckCheats/build/**/*.so
            CheckCheats/build/package/**
